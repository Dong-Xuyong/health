<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Health · Nutrition</title>
  <link rel="canonical" href="https://dong-xuyong.github.io/health/nutrition/" />
  <script>
    (function () {
      var hash = location.hash || "";
      var healthHash = /^#\/(?:$|injuries(?:\/|$)|trends(?:\/|$)|settings(?:\/|$))/.test(hash);
      var base = healthHash ? "/health/overview/" : "/health/nutrition/";
      location.replace(base + location.search + hash);
    })();
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=/health/nutrition/" /></noscript>
</head>
<body>
  <p>Nutrition is at <a href="/health/nutrition/">/health/nutrition/</a>. The health overview is at <a href="/health/overview/">/health/overview/</a>.</p>
