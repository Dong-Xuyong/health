<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f4ef" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Nutrition Tracker" />
  <title>Health · Nutrition</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥗</text></svg>" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Encode+Sans:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="dong-ui/theme.css?v=1" />
  <link rel="stylesheet" href="styles.css?v=6" />
  <link rel="stylesheet" href="/health/suite.css?v=2" />
  <script src="dong-ui/theme.js"></script>
</head>
<body>
  <header>
    <div class="brand">
      <h1>🥗 Nutrition Tracker</h1>
      <nav class="view-nav" aria-label="Sections">
        <a href="./" aria-current="page">Log</a>
        <a href="workout.html">Workout</a>
      </nav>
    </div>
    <span id="sync-label" aria-live="polite"></span>
    <a class="dong-home-link" href="https://dong-xuyong.github.io/" aria-label="Back to all apps" title="All apps"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></svg></a>
    <button type="button" data-dong-theme-toggle aria-label="Toggle color theme"></button>
  </header>
  <nav class="suite-nav" aria-label="Health sections">
    <a href="/health/nutrition/" aria-current="page">Nutrition</a>
    <a href="/health/training/">Training</a>
    <a href="/health/overview/">Health</a>
  </nav>
  <p id="demo-banner" class="banner" role="status" hidden><strong>Demo data</strong> <span>Sample meals. Nothing is saved.</span></p>
  <section id="hero" class="hero">
    <details class="fold hero-fold">
      <summary>
        <span class="fold-title" id="period-label"></span>
        <span class="fold-viz" id="hero-viz"></span>
        <span class="fold-stat" id="remain-line"></span>
      </summary>
      <div class="hero-top">
        <div id="ring" class="ring" aria-hidden="true"></div>
        <div class="hero-text">
          <p id="score-line"></p>
        </div>
      </div>
    </details>
    <div class="hero-foot">
      <div class="period-nav">
        <button type="button" id="prev" aria-label="Previous day">‹</button>
        <button type="button" id="today">Today</button>
        <button type="button" id="next" aria-label="Next day">›</button>
      </div>
    </div>
  </section>
  <main id="main"></main>
  <footer id="connect" hidden>
    <button type="button" id="btn-connect">Connect GitHub to sync</button>
  </footer>
  <script src="/health/suite-ui.js?v=1"></script>
  <script src="dong-ui/gh-sync.js?v=1"></script>
  <script src="core.js?v=5"></script>
  <script src="app.js?v=8"></script>
</body>
</html>
