<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f4ef" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Workout" />
  <title>Health · Workout</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏋️</text></svg>" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Encode+Sans:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="dong-ui/theme.css?v=1" />
  <link rel="stylesheet" href="styles.css?v=5" />
  <link rel="stylesheet" href="/health/suite.css?v=1" />
  <script src="dong-ui/theme.js"></script>
</head>
<body>
  <header>
    <div class="brand">
      <h1>🏋️ Workout</h1>
      <nav class="view-nav" aria-label="Sections">
        <a href="./">Log</a>
        <a href="workout.html" aria-current="page">Workout</a>
      </nav>
    </div>
    <span id="sync-label" aria-live="polite"></span>
    <a class="dong-home-link" href="https://dong-xuyong.github.io/" aria-label="Back to all apps" title="All apps"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></svg></a>
    <button type="button" data-dong-theme-toggle aria-label="Toggle color theme"></button>
  </header>
  <nav class="suite-nav" aria-label="Health sections">
    <a href="/health/">Health</a>
    <a href="/health/training/">Training</a>
    <a href="/health/nutrition/" aria-current="page">Nutrition</a>
  </nav>
  <p id="demo-banner" class="demo-banner" hidden>
    Sample data, shaped like the private log. This is not your nutrition file.
    <a href="workout.html">Load the GitHub log</a>
  </p>
  <section id="hero" class="hero">
    <div class="hero-text">
      <h2 id="period-label"></h2>
      <p id="remain-line"></p>
      <p id="score-line"></p>
      <p id="target-line"></p>
    </div>
    <div class="hero-foot spread">
      <div class="toggle" id="range-toggle"></div>
      <div class="period-nav">
        <button type="button" id="prev" aria-label="Earlier days">‹</button>
        <button type="button" id="today">Today</button>
        <button type="button" id="next" aria-label="Later days">›</button>
      </div>
    </div>
  </section>
  <main id="main"></main>
  <footer id="connect" hidden>
    <button type="button" id="btn-connect">Connect GitHub to sync</button>
  </footer>
  <script src="dong-ui/gh-sync.js?v=1"></script>
  <script src="core.js?v=5"></script>
  <script src="workout.js?v=3"></script>
</body>
</html>
